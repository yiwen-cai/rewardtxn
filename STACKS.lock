paper_eval_freeze:
  manifest_generator: scripts/freeze_paper_inputs.py
  manifest_status: pending
  required_before_formal_run:
    - full local image ID from docker image inspect
    - registry digest only when present in Docker RepoDigests
    - RewardTxn and used third_party commit plus clean dirty-state hash
    - content SHA-256 for the exact model, torch-dist model, dataset, and schedule used
  policy: RTX_PAPER_MODE=1 refuses draft/mismatched manifests and dirty repositories

